[project]
name = "budget-classifier"
version = "0.1.0"
description = "Online, self-labeling thinking-budget classifier for Thinking Brownout"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "numpy>=1.24"]

[project.optional-dependencies]
server = ["starlette>=0.37", "uvicorn>=0.30"]
test = ["pytest>=8", "starlette>=0.37"]

[project.scripts]
budget-classifier = "budget_classifier.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["budget_classifier*"]

[tool.setuptools.package-data]
budget_classifier = ["weights.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
