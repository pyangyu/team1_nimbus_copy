[project]
name = "lifeline-agent"
version = "0.1.0"
description = "Agentic workflow test agent for Lifeline (deadline-aware two-tier LLM serving)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lifeline-run = "lifeline_agent.run:cli"
lifeline-loadgen = "lifeline_agent.loadgen:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lifeline_agent*"]

