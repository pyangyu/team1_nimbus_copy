[project]
name = "brownout-gateway"
version = "0.1.0"
description = "Thinking Brownout front door: budget classifier, priority, load-driven thinking cuts and baselines in front of vLLM"
requires-python = ">=3.10"
dependencies = ["budget-classifier", "httpx>=0.27", "starlette>=0.37", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
brownout-gateway = "brownout_gateway.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brownout_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
