name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke = unit tests, secrets, shellcheck (under 5 min); full = smoke plus the AWS GPU jobs"
        type: choice
        options: [smoke, full]
        default: smoke

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.package }}, py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package: [agent, lifeline, classifier, gateway]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - id: present
        run: |
          if [ -f "${{ matrix.package }}/pyproject.toml" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.found == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml
      - if: steps.present.outputs.found == 'true'
        working-directory: ${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = gateway ]; then pip install -e ../classifier -e ../agent; fi
          pip install -e ".[test]"
          pytest -q

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --redact --verbose

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning infra/vllm-ec2/*.sh infra/brownout/*.sh
      - name: Remote scripts (run with common.sh prepended)
        run: |
          for f in infra/brownout/remote/*.sh; do
            [ "$f" = infra/brownout/remote/common.sh ] && continue
            cat infra/brownout/remote/common.sh "$f" | shellcheck --severity=warning -s bash -
          done

  aws:
    name: test on AWS GPU (agent, live vLLM)
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: aws-gpu
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      gpu_was: ${{ steps.before.outputs.state }}
    env:
      AWS_REGION: us-east-1
      INSTANCE_NAME: lifeline-vllm-batch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/pyproject.toml
      - run: pip install -e "agent[test,math]"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::826671498662:role/capstone-github-ci
          aws-region: us-east-1
      - name: Read the vLLM API key from SSM
        run: |
          key=$(aws ssm get-parameter --name /capstone/vllm-api-key --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$key"
          echo "LIFELINE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Note whether the GPU was already running
        id: before
        run: |
          state=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=$INSTANCE_NAME" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "ip=$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Start the batch-tier vLLM server
        run: infra/vllm-ec2/up.sh batch | grep -E '^LIFELINE_(BATCH_)?BASE_URL=' >> "$GITHUB_ENV"
      - name: Run all agent tests, including live ones against vLLM
        working-directory: agent
        env:
          MATH_AGENT_LIVE: "1"
        run: pytest -q -rs
      - name: Close the runner's firewall hole; stop the GPU if this run started it and the e2e job won't run
        if: always() && steps.before.outcome == 'success'
        run: |
          # On success the brownout-e2e job takes the running GPU over and stops it at the end,
          # so a capacity-starved zone never has to hand it out twice.
          if [ "${{ steps.before.outputs.state }}" = "stopped" ] && [ "${{ job.status }}" != "success" ]; then
            infra/vllm-ec2/down.sh batch || true
          fi
          sg=$(aws ec2 describe-security-groups --filters Name=group-name,Values=lifeline-vllm-sg \
            --query 'SecurityGroups[0].GroupId' --output text)
          aws ec2 revoke-security-group-ingress --group-id "$sg" --protocol tcp --port 8000 \
            --cidr "${{ steps.before.outputs.ip }}/32" >/dev/null 2>&1 || true

  brownout-e2e:
    name: Brownout end to end on AWS (agent box -> Jev gateway GPU -> vLLM GPU)
    needs: [test, aws]
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 230
    concurrency:
      group: aws-gpu
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      BROWNOUT_STOP: "1"
      BROWNOUT_STARTED_FILE: /tmp/brownout-started
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::826671498662:role/capstone-github-ci
          aws-region: us-east-1
          role-duration-seconds: 14400
      - name: Take over the vLLM GPU if the aws job started it
        if: needs.aws.outputs.gpu_was == 'stopped'
        run: |
          aws ec2 describe-instances --filters Name=tag:Name,Values=lifeline-vllm-batch \
            --query 'Reservations[0].Instances[0].InstanceId' --output text >> /tmp/brownout-started
      - name: Start the boxes, set up Open-Jev, deploy, sweep the policies
        run: infra/brownout/e2e.sh "${{ github.sha }}"
      - uses: aws-actions/configure-aws-credentials@v4
        if: always()
        with:
          role-to-assume: arn:aws:iam::826671498662:role/capstone-github-ci
          aws-region: us-east-1
      - name: Stop the boxes this run started
        if: always()
        run: |
          ids=$(tr '\n' ' ' < /tmp/brownout-started 2>/dev/null || true)
          if [ -n "${ids// /}" ]; then
            aws ec2 stop-instances --instance-ids $ids > /dev/null || true
          fi
      - name: Job summary
        if: always()
        run: |
          if [ -f brownout-results/results.md ]; then
            { echo "## Brownout policy sweep"; echo; cat brownout-results/results.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brownout-results
          path: brownout-results/
          if-no-files-found: warn
